{% extends "base.html" %}
{% from "macros.html" import icon, cover_waves with context %}
{% block content %}
<header class="page-cover page-cover--compact">
  <span class="cover-watermark cover-watermark--sub" aria-hidden="true">寻</span>
  <div class="cover-inner cover-inner--compact">
    <span class="eyebrow cover-eyebrow">SEARCH THE ARCHIVE</span>
    <h1>找一页旧笔记</h1>
    <p>跨标题、摘要、标签和正文搜索全部 {{ total_posts }} 篇文章。</p>
    <div class="hero-actions">
      <button class="button button--light search-trigger" type="button">{{ icon("search") }} 打开搜索</button>
    </div>
  </div>
  {{ cover_waves() }}
</header>
<div class="page-shell">
  <section class="section">
    <div class="tag-cloud">
      {% for tag in all_tags[:12] %}
        <a href="{{ tag.url }}">#{{ tag.name }}<small>{{ tag.count }}</small></a>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
