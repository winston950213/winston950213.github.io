{% extends "base.html" %}
{% block content %}
<div class="not-found">
  <div>
    <span class="eyebrow">MOVED TO A NEW SHELF</span>
    <h1>正在前往新地址</h1>
    <p>如果页面没有自动跳转，请点击下面的链接。</p>
    <a class="button button--primary" href="{{ target_url }}">继续阅读</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  setTimeout(() => location.replace({{ target_url|tojson }}), 40);
</script>
{% endblock %}
